<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuuloanalyysi v11: Prosentuaalinen Sanatesti</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { background: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; font-size: 1.1em; }
        .btn-test { background: #28a745; }
        .stats { display: flex; justify-content: space-around; background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
        input[type="text"], select, input[type="range"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .history-item { font-size: 0.85em; padding: 10px; border-bottom: 1px solid #eee; }
        .correct { color: green; } .wrong { color: red; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Kuuloindeksi (Speech Score)</h2>
        <div class="stats">
            <div>Testit: <span id="statTotal">0</span></div>
            <div>Oikein: <span id="statCorrect">0</span></div>
            <div>Erotuskyky: <span id="statPercent">0</span>%</div>
        </div>
        <button onclick="resetStats()" style="font-size:0.7em; background:none; border:none; color:gray; cursor:pointer;">Nollaa tilastot</button>
    </div>

    <div class="card">
        <h3>Testiasetukset</h3>
        <label>Korva: 
            <select id="channel">
                <option value="0">Molemmat</option>
                <option value="-1">Vasen (Tinnitus-puoli)</option>
                <option value="1">Oikea</option>
            </select>
        </label>
        <label>Taustahumina: <span id="noiseVal">20</span>%</label>
        <input type="range" id="noiseLevel" min="0" max="100" value="20" oninput="document.getElementById('noiseVal').innerText=this.value">
    </div>

    <div class="card">
        <h3>Sanojen erotustesti</h3>
        <button id="playBtn" onclick="startTest()" class="btn btn-test">Kuuntele sana</button>
        
        <div id="inputArea" style="display:none; margin-top:15px;">
            <input type="text" id="userInput" placeholder="Kirjoita mitä kuulit...">
            <button onclick="checkAnswer()" class="btn">Tarkista</button>
        </div>
        <div id="feedback" style="margin-top:10px; font-weight:bold;"></div>
    </div>

    <h3>Viimeisimmät tulokset</h3>
    <div id="log" class="card"></div>

    <script>
        let audioCtx, noiseNode, noiseGain, panner;
        let currentWord = "";
        const sanat = ["appelsiini", "tietokone", "ravintola", "mansikka", "aurinko", "perhonen", "mustikka", "polkupyörä", "koululainen", "sairaala", "lentokone", "puhelinvaihde", "valokuvaaja", "elokuvateatteri", "pääskynen"];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                panner = audioCtx.createStereoPanner();
                noiseGain = audioCtx.createGain();
                noiseGain.connect(panner).connect(audioCtx.destination);
            }
        }

        function startTest() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            document.getElementById('playBtn').disabled = true;
            document.getElementById('inputArea').style.display = 'block';
            document.getElementById('userInput').value = "";
            document.getElementById('feedback').innerText = "Humina päällä...";

            // Kohina
            stopNoise();
            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = noiseBuffer;
            noiseNode.loop = true;
            noiseNode.connect(noiseGain);
            noiseGain.gain.value = document.getElementById('noiseLevel').value / 100;
            panner.pan.value = document.getElementById('channel').value;
            noiseNode.start();

            // Puhe
            currentWord = sanat[Math.floor(Math.random() * sanat.length)];
            const msg = new SpeechSynthesisUtterance(currentWord);
            msg.lang = 'fi-FI';
            msg.rate = 0.7;
            window.speechSynthesis.speak(msg);
        }

        function checkAnswer() {
            const userIn = document.getElementById('userInput').value.trim().toLowerCase();
            const isCorrect = (userIn === currentWord.toLowerCase());
            stopNoise();
            
            saveResult(currentWord, userIn, isCorrect);
            
            document.getElementById('feedback').innerHTML = isCorrect ? 
                "<span class='correct'>OIKEIN</span>" : 
                "<span class='wrong'>VÄÄRIN.</span> Oikea oli: " + currentWord;
            
            document.getElementById('playBtn').disabled = false;
            updateStats();
        }

        function stopNoise() { if (noiseNode) { try { noiseNode.stop(); } catch(e){} } }

        function saveResult(word, input, correct) {
            let history = JSON.parse(localStorage.getItem('tinnitus_results') || "[]");
            history.unshift({
                date: new Date().toLocaleString('fi-FI'),
                word: word,
                input: input,
                correct: correct,
                noise: document.getElementById('noiseLevel').value,
                side: document.getElementById('channel').value
            });
            localStorage.setItem('tinnitus_results', JSON.stringify(history.slice(0, 50)));
            renderLog();
        }

        function updateStats() {
            let history = JSON.parse(localStorage.getItem('tinnitus_results') || "[]");
            let total = history.length;
            let correct = history.filter(h => h.correct).length;
            let percent = total > 0 ? Math.round((correct / total) * 100) : 0;
            
            document.getElementById('statTotal').innerText = total;
            document.getElementById('statCorrect').innerText = correct;
            document.getElementById('statPercent').innerText = percent;
        }

        function renderLog() {
            let history = JSON.parse(localStorage.getItem('tinnitus_results') || "[]");
            document.getElementById('log').innerHTML = history.map(h => `
                <div class="history-item">
                    ${h.date} | <strong>${h.correct ? '✓' : '✗'}</strong> | 
                    Kohina: ${h.noise}% | ${h.word} vs "${h.input}"
                </div>
            `).join('');
        }

        function resetStats() {
            if(confirm("Haluatko nollata tilastot?")) {
                localStorage.removeItem('tinnitus_results');
                updateStats();
                renderLog();
            }
        }

        updateStats();
        renderLog();
    </script>
</body>
</html>
