<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinnitus-seuranta Pro</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; line-height: 1.6; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        .val-display { float: right; font-family: monospace; font-size: 1.3em; color: #d63384; font-weight: bold; }
        input[type="range"] { width: 100%; height: 30px; cursor: pointer; margin-top: 10px; }
        .btn { background: #28a745; color: white; border: none; padding: 12px; margin-top: 10px; cursor: pointer; border-radius: 6px; width: 100%; font-size: 1.1em; }
        .btn-audio { background: #007bff; }
        .btn-stop { background: #dc3545; }
        .info-text { font-size: 0.85em; color: #666; margin-top: 5px; background: #fff3cd; padding: 10px; border-radius: 6px; }
        .history-item { background: #fff; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 5px solid #28a745; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Äänen voimakkuus & Peittotesti</h2>
        <div class="info-text">
            <strong>OHJE:</strong> Pidä puhelimen oma volyymi siinä asennossa, missä se sinulla yleensä on. Käytä alla olevaa säädintä testin tekemiseen.
        </div>

        <label>Testiäänen taso (0-100): <span id="volVal" class="val-display">50</span></label>
        <input type="range" id="audioVol" min="0" max="100" value="50">

        <label>Taajuus (Hz): <span id="hzVal" class="val-display">8000</span></label>
        <input type="range" id="freq" min="1000" max="15000" step="10" value="8000">

        <label>Sihinän määrä (%): <span id="noiseVal" class="val-display">0</span></label>
        <input type="range" id="noiseLevel" min="0" max="100" value="0">

        <button id="playBtn" class="btn btn-audio">Toista testiääni</button>
        <button id="stopBtn" class="btn btn-audio btn-stop" style="display:none;">Pysäytä testiääni</button>
    </div>

    <div class="card">
        <h2>Päivän havainnot</h2>
        <label>Tinnituksen voimakkuus (1-10):</label>
        <input type="range" id="volScore" min="1" max="10" value="5">

        <label>Peittopiste (Luku ylhäältä):</label>
        <input type="text" id="maskingPoint" placeholder="Millä numerolla ääni hävisi?">

        <label>Muistiinpanot (esim. ohimon tunne):</label>
        <textarea id="notes" rows="3" style="width:100%; border-radius:6px; border:1px solid #ccc;"></textarea>

        <button onclick="saveEntry()" class="btn">Tallenna historiatietoihin</button>
    </div>

    <h3>Historia</h3>
    <div id="history"></div>

    <script>
        let audioCtx, oscillator, noiseNode, gainNode;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            gainNode.connect(audioCtx.destination);
        }

        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');

        playBtn.onclick = () => {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stopAudio();

            oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.value = document.getElementById('freq').value;
            
            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = noiseBuffer;
            noiseNode.loop = true;

            const noiseGain = audioCtx.createGain();
            const oscGain = audioCtx.createGain();
            const nVal = document.getElementById('noiseLevel').value / 100;
            
            noiseGain.gain.value = nVal;
            oscGain.gain.value = 1 - (nVal * 0.5);

            oscillator.connect(oscGain).connect(gainNode);
            noiseNode.connect(noiseGain).connect(gainNode);
            
            gainNode.gain.value = document.getElementById('audioVol').value / 100;

            oscillator.start();
            noiseNode.start();
            playBtn.style.display = 'none';
            stopBtn.style.display = 'block';
        };

        function stopAudio() {
            if (oscillator) { try { oscillator.stop(); } catch(e){} }
            if (noiseNode) { try { noiseNode.stop(); } catch(e){} }
            playBtn.style.display = 'block';
            stopBtn.style.display = 'none';
        }

        stopBtn.onclick = stopAudio;

        // Päivitä luvut näytölle
        document.getElementById('audioVol').oninput = function() {
            document.getElementById('volVal').innerText = this.value;
            if (gainNode) gainNode.gain.value = this.value / 100;
        };
        document.getElementById('freq').oninput = function() {
            document.getElementById('hzVal').innerText = this.value;
            if (oscillator) oscillator.frequency.value = this.value;
        };
        document.getElementById('noiseLevel').oninput = function() {
            document.getElementById('noiseVal').innerText = this.value;
        };

        function saveEntry() {
            const entry = {
                date: new Date().toLocaleString('fi-FI'),
                vol: document.getElementById('volScore').value,
                mask: document.getElementById('maskingPoint').value,
                hz: document.getElementById('freq').value,
                note: document.getElementById('notes').value
            };
            let logs = JSON.parse(localStorage.getItem('tinnitus_v6') || "[]");
            logs.unshift(entry);
            localStorage.setItem('tinnitus_v6', JSON.stringify(logs));
            renderHistory();
            document.getElementById('notes').value = "";
            stopAudio();
        }

        function renderHistory() {
            const logs = JSON.parse(localStorage.getItem('tinnitus_v6') || "[]");
            document.getElementById('history').innerHTML = logs.map(l => `
                <div class="history-item">
                    <strong>${l.date}</strong><br>
                    Taajuus: ${l.hz} Hz | Peittopiste: ${l.mask}<br>
                    <em>${l.note}</em>
                </div>
            `).join('');
        }
        renderHistory();
    </script>
</body>
</html>
