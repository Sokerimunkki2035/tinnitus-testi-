<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinnitus-seuranta Pro + Peittotesti</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; line-height: 1.6; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="range"], input[type="text"], textarea { width: 100%; margin-top: 5px; box-sizing: border-box; }
        .btn { background: #28a745; color: white; border: none; padding: 12px; margin-top: 10px; cursor: pointer; border-radius: 6px; width: 100%; font-size: 1.1em; }
        .btn-audio { background: #007bff; }
        .btn-stop { background: #dc3545; }
        .btn-download { background: #6c757d; font-size: 0.8em; width: auto; padding: 5px 15px; }
        .slider-val { font-weight: normal; color: #666; float: right; }
        .history-item { background: #fff; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 5px solid #28a745; font-size: 0.9em; }
        .stereo-buttons { display: flex; gap: 5px; margin-top: 5px; }
        .stereo-btn { flex: 1; background: #eee; border: 1px solid #ccc; padding: 5px; cursor: pointer; border-radius: 4px; }
        .stereo-active { background: #007bff; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>1. Peittotesti (Vertailu)</h2>
        <p style="font-size: 0.85em; color: #555; background: #fff3cd; padding: 10px; border-radius: 5px;">
            <strong>OHJE:</strong> Aseta puhelimen oma volyymi aina 50%:iin. Pidä puhelinta nyrkissä korvan vieressä.
        </p>
        
        <label>Taajuus: <span id="hzVal" class="slider-val">8000</span> Hz</label>
        <input type="range" id="freq" min="1000" max="15000" step="10" value="8000">

        <label>Sihinä (Kohina): <span id="noiseVal" class="slider-val">0</span>%</label>
        <input type="range" id="noiseLevel" min="0" max="100" value="0">

        <label>Testiäänen voimakkuus: <span id="volDisp" class="slider-val">20</span>%</label>
        <input type="range" id="audioVol" min="0" max="100" value="20">

        <div class="stereo-buttons">
            <button class="stereo-btn stereo-active" onclick="setPan(-1, this)">Vasen</button>
            <button class="stereo-btn" onclick="setPan(0, this)">Molemmat</button>
            <button class="stereo-btn" onclick="setPan(1, this)">Oikea</button>
        </div>

        <button id="playBtn" class="btn btn-audio">Toista testiääni</button>
        <button id="stopBtn" class="btn btn-audio btn-stop" style="display:none;">Pysäytä</button>
    </div>

    <div class="card">
        <h2>2. Rekisteröinti</h2>
        <label>Tinnituksen voimakkuus (1-10):</label>
        <input type="range" id="volScore" min="1" max="10" value="5">
        
        <label>Yliääniherkkyys (1-10):</label>
        <input type="range" id="sensScore" min="1" max="10" value="1">

        <label>Millä %-teholla testiääni peittyi?</label>
        <input type="text" id="maskingPoint" placeholder="Esim. 30% kohdalla en enää erota testiääntä">

        <label>Ohimo & Muistiinpanot:</label>
        <textarea id="notes" rows="3" placeholder="Miltä vasen korva/ohimo tuntuu verrattuna oikeaan?"></textarea>

        <button onclick="saveEntry()" class="btn">Tallenna havainnot</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
        <h3>Historia</h3>
        <button onclick="downloadCSV()" class="btn btn-download">Lataa CSV</button>
    </div>
    <div id="history"></div>

    <script>
        let audioCtx, oscillator, noiseNode, gainNode, pannerNode;
        let currentPan = -1; // Oletuksena vasen korva

        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            pannerNode = audioCtx.createStereoPanner();
            pannerNode.connect(gainNode).connect(audioCtx.destination);
        }

        function setPan(val, btn) {
            currentPan = val;
            document.querySelectorAll('.stereo-btn').forEach(b => b.classList.remove('stereo-active'));
            btn.classList.add('stereo-active');
            if (pannerNode) pannerNode.pan.value = val;
        }

        playBtn.onclick = () => {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stopAudio();

            oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.value = document.getElementById('freq').value;
            
            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = noiseBuffer;
            noiseNode.loop = true;

            const noiseGain = audioCtx.createGain();
            const oscGain = audioCtx.createGain();
            const noiseVal = document.getElementById('noiseLevel').value / 100;
            
            noiseGain.gain.value = noiseVal;
            oscGain.gain.value = 1 - (noiseVal * 0.5);

            oscillator.connect(oscGain).connect(pannerNode);
            noiseNode.connect(noiseGain).connect(pannerNode);
            
            pannerNode.pan.value = currentPan;
            gainNode.gain.value = document.getElementById('audioVol').value / 100;

            oscillator.start();
            noiseNode.start();
            playBtn.style.display = 'none';
            stopBtn.style.display = 'block';
        };

        function stopAudio() {
            if (oscillator) { try { oscillator.stop(); } catch(e){} }
            if (noiseNode) { try { noiseNode.stop(); } catch(e){} }
            playBtn.style.display = 'block';
            stopBtn.style.display = 'none';
        }

        stopBtn.onclick = stopAudio;

        // Liukusäätimet
        document.getElementById('freq').oninput = function() { 
            document.getElementById('hzVal').innerText = this.value;
            if (oscillator) oscillator.frequency.value = this.value;
        };
        document.getElementById('audioVol').oninput = function() {
            document.getElementById('volDisp').innerText = this.value;
            if (gainNode) gainNode.gain.value = this.value / 100;
        };
        document.getElementById('noiseLevel').oninput = function() {
            document.getElementById('noiseVal').innerText = this.value;
        };

        function saveEntry() {
            const entry = {
                date: new Date().toLocaleString('fi-FI'),
                vol: document.getElementById('volScore').value,
                sens: document.getElementById('sensScore').value,
                masking: document.getElementById('maskingPoint').value,
                hz: document.getElementById('freq').value,
                note: document.getElementById('notes').value
            };
            let logs = JSON.parse(localStorage.getItem('tinnitus_logs_v4') || "[]");
            logs.unshift(entry);
            localStorage.setItem('tinnitus_logs_v4', JSON.stringify(logs));
            renderHistory();
            document.getElementById('notes').value = "";
            document.getElementById('maskingPoint').value = "";
            stopAudio();
        }

        function renderHistory() {
            const logs = JSON.parse(localStorage.getItem('tinnitus_logs_v4') || "[]");
            document.getElementById('history').innerHTML = logs.map(l => `
                <div class="history-item">
                    <strong>${l.date}</strong><br>
                    Voima: ${l.vol}/10 | Herkkyys: ${l.sens}/10 | Hz: ${l.hz}<br>
                    <strong>Peittopiste:</strong> ${l.masking}<br>
                    <p>${l.note}</p>
                </div>
            `).join('');
        }

        function downloadCSV() {
            const logs = JSON.parse(localStorage.getItem('tinnitus_logs_v4') || "[]");
            if(logs.length === 0) return alert("Ei tietoja.");
            let csv = "Pvm;Voimakkuus;Herkkyys;Taajuus;Peittopiste;Huomiot\n";
            logs.forEach(l => {
                csv += `${l.date};${l.vol};${l.sens};${l.hz};"${l.masking}";"${l.note}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "tinnitus_seuranta.csv");
            link.click();
        }
        renderHistory();
    </script>
</body>
</html>
