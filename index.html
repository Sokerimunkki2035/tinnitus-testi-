<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinnitus-seuranta Pro (Split Control)</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; line-height: 1.6; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        .val-display { float: right; font-family: monospace; font-size: 1.2em; color: #d63384; font-weight: bold; }
        .control-row { display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; padding: 10px; border-radius: 8px; margin-top: 5px; border: 1px solid #dee2e6; }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-round { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider-round:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider-round { background-color: #007bff; }
        input:checked + .slider-round:before { transform: translateX(26px); }
        .btn { background: #28a745; color: white; border: none; padding: 12px; margin-top: 10px; cursor: pointer; border-radius: 6px; width: 100%; font-size: 1.1em; }
        .btn-stop { background: #dc3545; }
        textarea { width: 100%; border-radius: 6px; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Äänien hienosäätö</h2>
        
        <label>1. Vihellys (Siniääni)</label>
        <div class="control-row">
            <span>Päällä / Pois</span>
            <label class="switch">
                <input type="checkbox" id="oscEnabled" checked>
                <span class="slider-round"></span>
            </label>
        </div>
        <label>Taajuus: <span id="hzVal" class="val-display">9680</span> Hz</label>
        <input type="range" id="freq" min="1000" max="15000" step="10" value="9680">

        <label>2. Suhina (Valkoinen kohina)</label>
        <div class="control-row">
            <span>Päällä / Pois</span>
            <label class="switch">
                <input type="checkbox" id="noiseEnabled" checked>
                <span class="slider-round"></span>
            </label>
        </div>
        <label>Suhinan voimakkuus: <span id="noiseVal" class="val-display">0</span>%</label>
        <input type="range" id="noiseLevel" min="0" max="100" value="0">

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <label>Yleinen voimakkuus: <span id="volVal" class="val-display">50</span></label>
        <input type="range" id="audioVol" min="0" max="100" value="50">

        <button id="playBtn" class="btn" style="background:#007bff;">Käynnistä testi</button>
        <button id="stopBtn" class="btn btn-stop" style="display:none;">Pysäytä kaikki</button>
    </div>

    <div class="card">
        <h2>Päivän havainnot</h2>
        <label>Peittopiste (Luku):</label>
        <input type="text" id="maskingPoint" placeholder="Esim. Vihellys peittyi tasolla 86">
        
        <label>Muistiinpanot:</label>
        <textarea id="notes" rows="4" placeholder="Kirjaa tähän esim. sormen asento tai jos jompikumpi ääni puuttui..."></textarea>

        <button onclick="saveEntry()" class="btn">Tallenna havainto</button>
    </div>

    <div id="history"></div>

    <script>
        let audioCtx, oscillator, noiseNode, gainNode, oscGain, noiseGain;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            oscGain = audioCtx.createGain();
            noiseGain = audioCtx.createGain();
            
            oscGain.connect(gainNode);
            noiseGain.connect(gainNode);
            gainNode.connect(audioCtx.destination);
        }

        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');

        playBtn.onclick = () => {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stopAudio();

            // Siniääni (Vihellys)
            oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.value = document.getElementById('freq').value;
            oscillator.connect(oscGain);
            
            // Kohina (Suhina)
            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = noiseBuffer;
            noiseNode.loop = true;
            noiseNode.connect(noiseGain);

            updateStates();
            oscillator.start();
            noiseNode.start();
            
            playBtn.style.display = 'none';
            stopBtn.style.display = 'block';
        };

        function updateStates() {
            if (!gainNode) return;
            gainNode.gain.value = document.getElementById('audioVol').value / 100;
            oscGain.gain.value = document.getElementById('oscEnabled').checked ? 1.0 : 0;
            noiseGain.gain.value = document.getElementById('noiseEnabled').checked ? (document.getElementById('noiseLevel').value / 100) : 0;
        }

        function stopAudio() {
            if (oscillator) { try { oscillator.stop(); } catch(e){} }
            if (noiseNode) { try { noiseNode.stop(); } catch(e){} }
            playBtn.style.display = 'block';
            stopBtn.style.display = 'none';
        }

        stopBtn.onclick = stopAudio;
        document.getElementById('oscEnabled').onchange = updateStates;
        document.getElementById('noiseEnabled').onchange = updateStates;
        document.getElementById('audioVol').oninput = function() { document.getElementById('volVal').innerText = this.value; updateStates(); };
        document.getElementById('freq').oninput = function() { document.getElementById('hzVal').innerText = this.value; if(oscillator) oscillator.frequency.value = this.value; };
        document.getElementById('noiseLevel').oninput = function() { document.getElementById('noiseVal').innerText = this.value; updateStates(); };

        function saveEntry() {
            const entry = {
                date: new Date().toLocaleString('fi-FI'),
                mask: document.getElementById('maskingPoint').value,
                hz: document.getElementById('freq').value,
                note: document.getElementById('notes').value
            };
            let logs = JSON.parse(localStorage.getItem('tinnitus_v7') || "[]");
            logs.unshift(entry);
            localStorage.setItem('tinnitus_v7', JSON.stringify(logs));
            renderHistory();
            document.getElementById('notes').value = "";
            stopAudio();
        }

        function renderHistory() {
            const logs = JSON.parse(localStorage.getItem('tinnitus_v7') || "[]");
            document.getElementById('history').innerHTML = logs.map(l => `
                <div class="card" style="font-size:0.9em; border-left: 5px solid #007bff;">
                    <strong>${l.date}</strong><br>
                    Hz: ${l.hz} | Peitto: ${l.mask}<br>
                    <p>${l.note}</p>
                </div>
            `).join('');
        }
        renderHistory();
    </script>
</body>
</html>
