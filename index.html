<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Tinnitus & Hyperakusia -seuranta</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; line-height: 1.6; background: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .entry { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 0.9em; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.8em; color: #666; }
        button { background: #28a745; color: white; border: none; padding: 12px 20px; margin-top: 20px; cursor: pointer; border-radius: 4px; width: 100%; font-size: 1em; }
        button:hover { background: #218838; }
        h2 { color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Päivittäinen rekisteröinti</h2>
        
        <label>Päivämäärä:</label>
        <input type="datetime-local" id="date">

        <label>Tinnituksen voimakkuus (1-10):</label>
        <input type="range" id="volume" min="1" max="10" value="5">
        <div class="slider-label"><span>Hiljainen</span><span>Erittäin kova</span></div>

        <label>Yliääniherkkyys (1-10):</label>
        <input type="range" id="sensitivity" min="1" max="10" value="1">
        <div class="slider-label"><span>Normaali</span><span>Kivulias</span></div>

        <label>Äänimaailma (esim. vihellys, sihinä):</label>
        <input type="text" id="soundType" placeholder="Mitä ääniä kuuluu?">

        <label>Ohimon tunne & muistiinpanot:</label>
        <textarea id="templeNote" rows="2" placeholder="Tuntuuko ohimolla painetta tai kireyttä? Mitkä äänet häiritsivät?"></textarea>

        <button onclick="saveEntry()">Tallenna päivän tiedot</button>
    </div>

    <h3>Historia</h3>
    <div id="history"></div>

    <script>
        // Asetetaan oletusajaksi nykyhetki
        document.getElementById('date').value = new Date().toISOString().slice(0, 16);

        function saveEntry() {
            const entry = {
                date: document.getElementById('date').value,
                vol: document.getElementById('volume').value,
                sens: document.getElementById('sensitivity').value,
                sound: document.getElementById('soundType').value,
                note: document.getElementById('templeNote').value
            };
            
            let history = JSON.parse(localStorage.getItem('tinnitusLogV2') || "[]");
            history.unshift(entry);
            localStorage.setItem('tinnitusLogV2', JSON.stringify(history));
            displayHistory();
            
            // Tyhjennetään tekstikentät tallennuksen jälkeen
            document.getElementById('soundType').value = "";
            document.getElementById('templeNote').value = "";
        }

        function displayHistory() {
            const history = JSON.parse(localStorage.getItem('tinnitusLogV2') || "[]");
            const container = document.getElementById('history');
            container.innerHTML = history.map(e => `
                <div class="entry">
                    <strong>${new Date(e.date).toLocaleString('fi-FI')}</strong><br>
                    Ääni: ${e.vol}/10 | Herkkyys: ${e.sens}/10<br>
                    <em>${e.sound}</em><br>
                    <small>${e.note}</small>
                </div>
            `).join('');
        }
        displayHistory();
    </script>
</body>
</html>
